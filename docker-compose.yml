# ── CampusFlow — Production Docker Compose ────────────────────────────────────
# Quick start:
#   cp backend/.env.example backend/.env   # fill in JWT_SECRET
#   docker compose up --build
#
# Services: frontend (nginx), backend (Node.js), mongo, redis

services:

  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: campusflow_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-campusflow}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-changeme}
      MONGO_INITDB_DATABASE: CampusFlow
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: campusflow_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Backend ───────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusflow_backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:      production
      PORT:          5000
      LOCAL_DOCKER:  "true"
      MONGO_URI:     mongodb://${MONGO_USER:-campusflow}:${MONGO_PASS:-changeme}@mongo:27017/CampusFlow?authSource=admin
      JWT_SECRET:    ${JWT_SECRET:?JWT_SECRET must be set in .env or environment}
      FRONTEND_URL:  ${FRONTEND_URL:-http://localhost}
      # Redis / BullMQ
      REDIS_ENABLED: "true"
      REDIS_URL:     redis://redis:6379
      # Email
      EMAIL_ENABLED:  ${EMAIL_ENABLED:-false}
      EMAIL_HOST:     ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT:     ${EMAIL_PORT:-587}
      EMAIL_SECURE:   ${EMAIL_SECURE:-false}
      EMAIL_USER:     ${EMAIL_USER:-}
      EMAIL_PASS:     ${EMAIL_PASS:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM:     ${EMAIL_FROM:-noreply@campusflow.edu}
      # Storage
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR:     /app/uploads
      AWS_REGION:     ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID:     ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET:      ${S3_BUCKET:-campusflow-uploads}
      AWS_ENDPOINT:   ${AWS_ENDPOINT:-}
      # Logging
      LOG_LEVEL:     ${LOG_LEVEL:-info}
    volumes:
      - uploads:/app/uploads
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ""   # empty = same-origin (nginx proxies /api)
    container_name: campusflow_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
  uploads:
