# ── CampusFlow — Render Blueprint ─────────────────────────────────────────────
# Deploy both services in one click:
#   Render → New → Blueprint → connect repo → Apply
#
# Secrets you MUST enter in the Render dashboard when prompted (sync: false):
#   JWT_SECRET   — run:  node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
#   MONGO_URI    — MongoDB Atlas connection string (mongodb+srv://...)
#   EMAIL_USER   — your Gmail address  (only needed if EMAIL_ENABLED=true)
#   EMAIL_PASS   — Gmail App Password, 16 chars no spaces  (only if EMAIL_ENABLED=true)

services:

  # ════════════════════════════════════════════════════════════════════════════
  # Backend — Node.js Web Service
  # Live URL: https://campusflow-backend.onrender.com
  # ════════════════════════════════════════════════════════════════════════════
  - type: web
    name: campusflow-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    plan: free
    healthCheckPath: /health

    envVars:
      # ── Server ──────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production

      # LOCAL_DOCKER=false ensures secure HTTPS-only cookies are used in production.
      # Never set this to "true" on Render.
      - key: LOCAL_DOCKER
        value: "false"

      # Render injects PORT automatically — do NOT set it here.

      # ── Auth — REQUIRED ──────────────────────────────────────────────────────
      # Generate with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: JWT_SECRET
        sync: false

      - key: JWT_EXPIRES_IN
        value: 15m

      - key: JWT_REFRESH_IN
        value: 30d

      # ── Database — REQUIRED ──────────────────────────────────────────────────
      # MongoDB Atlas: mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/CampusFlow
      - key: MONGO_URI
        sync: false

      # ── CORS + Cookie origin ─────────────────────────────────────────────────
      # Must exactly match the frontend service URL (no trailing slash).
      # This also controls which origin receives the httpOnly auth cookie.
      - key: FRONTEND_URL
        value: https://campusflow-frontend.onrender.com

      # ── Redis / BullMQ ────────────────────────────────────────────────────────
      # Free tier: Redis disabled — escalation job runs in-process via setInterval.
      - key: REDIS_ENABLED
        value: "false"
      - key: REDIS_URL
        value: ""

      # ── Email ────────────────────────────────────────────────────────────────
      # Set EMAIL_ENABLED to "true" and fill in EMAIL_USER + EMAIL_PASS
      # once you have a Gmail App Password. Safe to leave false initially.
      - key: EMAIL_ENABLED
        value: "false"
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_SECURE
        value: "false"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        value: "CampusFlow <noreply@campusflow.edu>"

      # ── File storage ──────────────────────────────────────────────────────────
      - key: STORAGE_DRIVER
        value: local

      # ── Logging ───────────────────────────────────────────────────────────────
      - key: LOG_LEVEL
        value: info

  # ════════════════════════════════════════════════════════════════════════════
  # Frontend — React Static Site
  # Live URL: https://campusflow-frontend.onrender.com
  # ════════════════════════════════════════════════════════════════════════════
  - type: web
    name: campusflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build

    # React Router v7: rewrite every path to index.html so direct URLs work.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Security headers
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Long-term cache for hashed static assets (JS/CSS bundles)
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    envVars:
      # Baked into the React bundle at build time.
      # Points all fetch() calls AND Socket.io connections to the backend.
      # Must match the backend service name above exactly.
      - key: REACT_APP_API_URL
        value: https://campusflow-backend.onrender.com
