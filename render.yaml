# ── CampusFlow — Render Blueprint ─────────────────────────────────────────────
# Deploy both services in one click:
#   Render → New → Blueprint → connect your GitHub repo → Apply
#
# Secrets you MUST enter in the Render dashboard when prompted (marked sync: false):
#   JWT_SECRET   — generate: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
#   MONGO_URI    — MongoDB Atlas: mongodb+srv://<user>:<pass>@<cluster>.mongodb.net/CampusFlow
#   EMAIL_USER   — your Gmail address         (only needed when EMAIL_ENABLED=true)
#   EMAIL_PASS   — Gmail App Password 16 chars (only needed when EMAIL_ENABLED=true)

services:

  # ════════════════════════════════════════════════════════════════════════════
  # Backend — Node.js Web Service
  # Live URL: https://campusflow-backend.onrender.com
  # ════════════════════════════════════════════════════════════════════════════
  - type: web
    name: campusflow-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    plan: free
    healthCheckPath: /health

    envVars:
      # ── Server ──────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production

      # LOCAL_DOCKER=false → enables secure=true + sameSite=none cookies over HTTPS.
      # Never change this to "true" on Render.
      - key: LOCAL_DOCKER
        value: "false"

      # PORT is injected automatically by Render — do NOT set it here.

      # ── Auth (REQUIRED — set in Render dashboard) ────────────────────────────
      - key: JWT_SECRET
        sync: false

      - key: JWT_EXPIRES_IN
        value: 15m

      - key: JWT_REFRESH_IN
        value: 30d

      # ── Database (REQUIRED — set in Render dashboard) ────────────────────────
      # MongoDB Atlas connection string:
      #   mongodb+srv://campusflow:<password>@cluster0.xxxxx.mongodb.net/CampusFlow?retryWrites=true&w=majority
      - key: MONGO_URI
        sync: false

      # ── CORS + cookie origin ─────────────────────────────────────────────────
      # Must exactly match the frontend service URL (no trailing slash).
      # Controls which origin receives the httpOnly auth cookie.
      - key: FRONTEND_URL
        value: https://campusflow-frontend-1fwd.onrender.com
      # NOTE: If Render assigns a unique suffix to the service name (e.g. campusflow-backend-s6mi),
      # update REACT_APP_API_URL below and FRONTEND_URL above to match the actual Render URLs.

      # ── Redis / BullMQ ───────────────────────────────────────────────────────
      # Disabled on free tier — escalation job runs in-process via setInterval.
      - key: REDIS_ENABLED
        value: "false"
      - key: REDIS_URL
        value: ""

      # ── Email ────────────────────────────────────────────────────────────────
      # EMAIL_ENABLED=false is safe for initial deployment.
      # To enable email: set to "true" and fill in EMAIL_USER + EMAIL_PASS below.
      - key: EMAIL_ENABLED
        value: "false"
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_SECURE
        value: "false"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        value: "CampusFlow <noreply@campusflow.edu>"

      # ── File storage ─────────────────────────────────────────────────────────
      # NOTE: "local" storage is ephemeral on Render free tier.
      # Uploaded files will not persist across deploys/restarts.
      # Switch to STORAGE_DRIVER=s3 with AWS credentials for persistent uploads.
      - key: STORAGE_DRIVER
        value: local

      # ── Logging ──────────────────────────────────────────────────────────────
      - key: LOG_LEVEL
        value: info

  # ════════════════════════════════════════════════════════════════════════════
  # Frontend — React Static Site
  # Live URL: https://campusflow-frontend.onrender.com
  # ════════════════════════════════════════════════════════════════════════════
  - type: web
    name: campusflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build

    # React Router v7: rewrite every URL to index.html so direct links work.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Security headers
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Long-term cache for hashed JS/CSS bundles (safe — CRA appends content hash)
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    envVars:
      # Baked into the React bundle at build time.
      # Points all fetch() calls AND Socket.io connections to the backend.
      # Must exactly match the backend service name above.
      # Last verified: campusflow-backend-s6mi.onrender.com (commit forced rebuild)
      - key: REACT_APP_API_URL
        value: https://campusflow-backend-s6mi.onrender.com
