server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/json application/javascript
                    application/x-javascript text/xml application/xml
                    application/rss+xml text/javascript image/svg+xml;

    # React Router — serve index.html for all non-asset routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (hashed filenames, safe to cache forever)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires        1y;
        add_header     Cache-Control "public, immutable";
        access_log     off;
    }

    # Proxy /api/* to backend
    location /api/ {
        proxy_pass              http://backend:5000;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Cookie            $http_cookie;
        proxy_read_timeout      90s;
        proxy_connect_timeout   10s;
        proxy_send_timeout      90s;
        # Don't buffer API responses — stream them
        proxy_buffering         off;
    }

    # Proxy Socket.io (requires upgrade for WebSocket + long-polling keepalive)
    location /socket.io/ {
        proxy_pass              http://backend:5000;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        "upgrade";
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Cookie            $http_cookie;
        # Socket.io needs long timeouts for persistent connections
        proxy_read_timeout      3600s;
        proxy_send_timeout      3600s;
        proxy_buffering         off;
    }

    # Proxy health / readiness endpoints (used by load-balancer checks)
    location ~ ^/(health|ready)$ {
        proxy_pass          http://backend:5000;
        proxy_http_version  1.1;
        proxy_set_header    Host $host;
        access_log          off;
    }

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"                        always;
    add_header X-Content-Type-Options "nosniff"                           always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
}
